<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>LLM Gateway Dashboard</title>
<base href="{{BASE_PATH}}">
<script src="dashboard/chart.umd.min.js"></script>
<style>
:root { --bg: #1a1a2e; --surface: #16213e; --border: #0f3460; --text: #e0e0e0; --muted: #888; --accent: #0ea5e9; --accent2: #7c3aed; --accent3: #10b981; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem; min-width: 1400px; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { margin-bottom: 1rem; font-size: 1.5rem; }
.title-bar { display: flex; align-items: baseline; gap: 0.65rem; margin-bottom: 1rem; }
.title-bar h1 { margin-bottom: 0; }
.title-meta { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.72rem; }
.controls { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; align-items: center; }
.controls .sep { width: 1px; height: 1.5rem; background: var(--border); margin: 0 0.3rem; }
.controls .lbl { font-size: 0.75rem; color: var(--muted); margin-right: 0.2rem; }
.btn { padding: 0.35rem 0.7rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.78rem; }
.btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.active2 { background: var(--accent2); border-color: var(--accent2); color: #fff; }
.btn.active3 { background: var(--accent3); border-color: var(--accent3); color: #fff; }
.btn:hover { opacity: 0.85; }
select { padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-size: 0.78rem; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-bottom: 1.2rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; }
.card .value { font-size: 1.3rem; font-weight: 700; margin-top: 0.2rem; }
.card .label { font-size: 0.75rem; color: var(--muted); }
.chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; position: relative; z-index: 10; }

canvas { width: 100% !important; }
.token-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
.token-bar input { flex: 1; max-width: 300px; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-size: 0.78rem; font-family: monospace; }
.token-bar .status { font-size: 0.75rem; }
.token-bar .status.ok { color: var(--accent3); }
.token-bar .status.err { color: #ef4444; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn.loading { pointer-events: none; opacity: 0.7; }
.btn.loading::after { content: ''; display: inline-block; width: 10px; height: 10px; border: 2px solid #888; border-top-color: #e0e0e0; border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 4px; vertical-align: middle; }
</style>
</head>
<body>
<div class="container" id="app" data-commit="{{BUILD_COMMIT}}"></div>
<script>
const app = document.getElementById('app');
let chart = null;
const clientTimeZone = (() => {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (_) { return 'UTC'; }
})();
const defaultDims = { client: false, model: false, account: false, reasoningEffort: false };
let savedDims = {};
try { savedDims = JSON.parse(localStorage.getItem('c2a_dims') || '{}') || {}; } catch (_) {}
let currentRange = localStorage.getItem('c2a_range') || 30, currentAggr = localStorage.getItem('c2a_aggr') || 'day', currentDims = { ...defaultDims, ...savedDims }, currentTokenView = 'all';
let filterClient = localStorage.getItem('c2a_filterClient') || '', filterModel = localStorage.getItem('c2a_filterModel') || '', filterAccount = localStorage.getItem('c2a_filterAccount') || '', filterReasoningEffort = localStorage.getItem('c2a_filterReasoningEffort') || '';
let rawData = [];

async function showDashboard() {
  app.innerHTML = `<div class="title-bar"><h1>📊 LLM Gateway Usage</h1><span class="title-meta" id="buildCommit"></span><span class="title-meta" id="clientTimezone"></span></div>
<div class="token-bar">
  <span class="lbl">API Key:</span>
  <input type="password" id="apiToken" placeholder="Enter control plane admin token" value="${localStorage.getItem('c2a_token') || ''}">
  <button class="btn" onclick="document.getElementById('apiToken').type = document.getElementById('apiToken').type === 'password' ? 'text' : 'password'">👁</button>
  <span class="status" id="tokenStatus"></span>
  <div class="sep"></div>
  <button class="btn" id="btnRefresh">🔄</button>
  <span class="lbl">Auto:</span>
  <button class="btn ar" data-ar="0">Off</button><button class="btn ar" data-ar="60">1m</button><button class="btn ar" data-ar="120">2m</button><button class="btn ar active3" data-ar="300">5m</button><button class="btn ar" data-ar="1800">30m</button><button class="btn ar" data-ar="3600">1h</button>
</div>
<div class="controls">
  <span class="lbl">Range:</span>
  <button class="btn range" data-d="7">7d</button><button class="btn range active" data-d="30">30d</button><button class="btn range" data-d="90">90d</button><button class="btn range" data-d="180">180d</button><button class="btn range" data-d="365">1y</button>
  <button class="btn range" data-d="month">This Month</button><button class="btn range" data-d="quarter">This Q</button>
  <div class="sep"></div>
  <select id="pickMonth"><option value="">Month…</option></select>
  <select id="pickQuarter"><option value="">Quarter…</option></select>
  <div class="sep"></div>
  <span class="lbl">Group:</span>
  <button class="btn aggr active2" data-a="day">Day</button><button class="btn aggr" data-a="week">Week</button><button class="btn aggr" data-a="month">Month</button>
  <div class="sep"></div>
  <span class="lbl">Tokens:</span>
  <button class="btn tv active3" data-tv="all">All</button><button class="btn tv" data-tv="input">Input</button><button class="btn tv" data-tv="output">Output</button>
</div>
<div class="controls">
  <span class="lbl">Dimension:</span>
  <button class="btn dim" data-dim="client">By Client</button><button class="btn dim" data-dim="model">By Model</button><button class="btn dim" data-dim="account">By Account</button><button class="btn dim" data-dim="reasoningEffort">By Reasoning Effort</button><button class="btn dim active" data-dim="aggr">Aggregated</button>
  <div class="sep"></div>
  <span class="lbl">Filter:</span>
  <select id="fClient"><option value="">All Clients</option></select>
  <select id="fModel"><option value="">All Models</option></select>
  <select id="fAccount"><option value="">All Accounts</option></select>
  <select id="fReasoningEffort"><option value="">All Efforts</option></select>
  <div class="sep"></div>
  <span id="cards-subtitle" style="font-size:0.85rem;color:var(--muted)"></span>
</div>
<div class="cards" id="cards"></div>
<div id="pricingStatus" role="status" style="font-size:0.8rem;color:var(--muted);margin:-0.5rem 0 1rem;overflow-wrap:anywhere"></div>
<div class="chart-container"><canvas id="chart"></canvas></div>`;
  document.getElementById('buildCommit').textContent = `commit ${app.dataset.commit}`;
  document.getElementById('clientTimezone').textContent = `timezone ${clientTimeZone}`;

  // populate month/quarter pickers FIRST, then attach handlers
  const now = new Date();
  const pmEl = document.getElementById('pickMonth'), pqEl = document.getElementById('pickQuarter');
  let pmOpts = '', pqOpts = '';
  for (let y = now.getFullYear(); y >= 2025; y--) {
    const mEnd = y === now.getFullYear() ? now.getMonth() + 1 : 12;
    for (let m = mEnd; m >= 1; m--) {
      pmOpts += `<option value="${y}-${String(m).padStart(2,'0')}">${y}-${String(m).padStart(2,'0')}</option>`;
    }
    for (let q = (y === now.getFullYear() ? Math.ceil((now.getMonth()+1)/3) : 4); q >= 1; q--) {
      pqOpts += `<option value="${y}-Q${q}">${y} Q${q}</option>`;
    }
  }
  pmEl.innerHTML += pmOpts;
  pqEl.innerHTML += pqOpts;

  function clearRangeActive() { document.querySelectorAll('.range').forEach(x=>x.classList.remove('active')); pmEl.value=''; pqEl.value=''; }

  document.querySelectorAll('.range').forEach(b => b.onclick = () => {
    clearRangeActive(); b.classList.add('active');
    currentRange = b.dataset.d; localStorage.setItem('c2a_range', currentRange); fetchData();
  });
  pmEl.onchange = () => { const v = pmEl.value; if(v) { document.querySelectorAll('.range').forEach(x=>x.classList.remove('active')); pqEl.value=''; currentRange = 'pick:'+v; localStorage.setItem('c2a_range', currentRange); fetchData(); } };
  pqEl.onchange = () => { const v = pqEl.value; if(v) { document.querySelectorAll('.range').forEach(x=>x.classList.remove('active')); pmEl.value=''; currentRange = 'pick:'+v; localStorage.setItem('c2a_range', currentRange); fetchData(); } };
  document.querySelectorAll('.aggr').forEach(b => b.onclick = () => { currentAggr = b.dataset.a; localStorage.setItem('c2a_aggr', currentAggr); document.querySelectorAll('.aggr').forEach(x=>x.classList.remove('active2')); b.classList.add('active2'); render(); });
  document.querySelectorAll('.tv').forEach(b => b.onclick = () => { currentTokenView = b.dataset.tv; document.querySelectorAll('.tv').forEach(x=>x.classList.remove('active3')); b.classList.add('active3'); render(); });
  document.querySelectorAll('.dim').forEach(b => b.onclick = () => {
    const dim = b.dataset.dim;
    if (dim === 'aggr') {
      currentDims = { ...defaultDims };
      document.querySelectorAll('.dim').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    } else {
      document.querySelector('.dim[data-dim="aggr"]').classList.remove('active');
      currentDims[dim] = !currentDims[dim];
      b.classList.toggle('active');
      if (!currentDims.client && !currentDims.model && !currentDims.account && !currentDims.reasoningEffort) {
        currentDims = { ...defaultDims };
        document.querySelector('.dim[data-dim="aggr"]').classList.add('active');
      }
    }
    localStorage.setItem('c2a_dims', JSON.stringify(currentDims));
    render();
  });
  document.getElementById('fClient').onchange = e => { filterClient = e.target.value; localStorage.setItem('c2a_filterClient', filterClient); render(); };
  document.getElementById('fModel').onchange = e => { filterModel = e.target.value; localStorage.setItem('c2a_filterModel', filterModel); render(); };
  document.getElementById('fAccount').onchange = e => { filterAccount = e.target.value; localStorage.setItem('c2a_filterAccount', filterAccount); render(); };
  document.getElementById('fReasoningEffort').onchange = e => { filterReasoningEffort = e.target.value; localStorage.setItem('c2a_filterReasoningEffort', filterReasoningEffort); render(); };

  // Restore saved Range button/picker
  const savedRange = String(currentRange);
  if (savedRange.startsWith('pick:')) {
    document.querySelectorAll('.range').forEach(x=>x.classList.remove('active'));
    const pickVal = savedRange.slice(5);
    if (pickVal.length === 7) { pmEl.value = pickVal; } else { pqEl.value = pickVal; }
  } else {
    document.querySelectorAll('.range').forEach(b => { if (b.dataset.d === savedRange) { b.classList.add('active'); } else { b.classList.remove('active'); } });
  }
  // Restore saved Group button
  document.querySelectorAll('.aggr').forEach(b => { if (b.dataset.a === currentAggr) { b.classList.add('active2'); } else { b.classList.remove('active2'); } });
  // Restore saved Dimension buttons
  if (currentDims.client || currentDims.model || currentDims.account || currentDims.reasoningEffort) {
    document.querySelector('.dim[data-dim="aggr"]').classList.remove('active');
    if (currentDims.client) document.querySelector('.dim[data-dim="client"]').classList.add('active');
    if (currentDims.model) document.querySelector('.dim[data-dim="model"]').classList.add('active');
    if (currentDims.account) document.querySelector('.dim[data-dim="account"]').classList.add('active');
    if (currentDims.reasoningEffort) document.querySelector('.dim[data-dim="reasoningEffort"]').classList.add('active');
  }
  document.getElementById('apiToken').onchange = e => { localStorage.setItem('c2a_token', e.target.value); fetchData(); };

  // Auto-refresh buttons
  const savedAR = localStorage.getItem('c2a_autoRefresh') || '300';
  document.querySelectorAll('.ar').forEach(b => {
    if (b.dataset.ar === savedAR) { b.classList.add('active3'); } else { b.classList.remove('active3'); }
    b.onclick = () => {
      document.querySelectorAll('.ar').forEach(x => x.classList.remove('active3'));
      b.classList.add('active3');
      localStorage.setItem('c2a_autoRefresh', b.dataset.ar);
      setupAutoRefresh(+b.dataset.ar);
    };
  });
  setupAutoRefresh(+savedAR);
  document.getElementById('btnRefresh').onclick = async () => {
    const btn = document.getElementById('btnRefresh');
    btn.classList.add('loading');
    await fetchData();
    btn.classList.remove('loading');
  };

  fetchData();
}

let autoRefreshTimer = null;
function setupAutoRefresh(secs) {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  if (secs > 0) { autoRefreshTimer = setInterval(fetchData, secs * 1000); }
}

// Prices are requested for models in the historical usage, never the live catalog.
let PRICING = Object.create(null);
let pricingLoaded = false;
let pricingError = false;
let dataRequestID = 0;

function tokenPrice(value) {
  return typeof value === 'number' && Number.isFinite(value) && value >= 0 ? value * 1e6 : null;
}

async function fetchPricing(models, token) {
  const result = Object.create(null);
  const names = [...new Set(models.filter(m => typeof m === 'string' && m.trim()))].sort();
  // Never send an empty model list: the API would fall back to the live catalog.
  // Bound query size for long historical ranges with many models.
  for (let i = 0; i < names.length; i += 50) {
    const params = new URLSearchParams({ models: names.slice(i, i + 50).join(',') });
    const r = await fetch(new URL(`usage/pricing?${params}`, document.baseURI), { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) throw new Error(`Pricing request failed (${r.status})`);
    const data = await r.json();
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Invalid pricing response');
    for (const model of names.slice(i, i + 50)) {
      const info = data[model];
      if (!info || typeof info !== 'object' || Array.isArray(info)) continue;
      result[model] = {
        input: tokenPrice(info.input_cost_per_token),
        output: tokenPrice(info.output_cost_per_token),
        cached: tokenPrice(info.cache_read_input_token_cost),
        cacheCreation: tokenPrice(info.cache_creation_input_token_cost),
      };
    }
  }
  return result;
}

function getPrice(model) {
  // The API returns prices keyed by the requested model name after normalization.
  // Do not fuzzy-match other returned models or silently invent cache prices.
  return pricingLoaded ? PRICING[model] || null : null;
}

function estimateCost(data) {
  let cost = 0, pricedRequests = 0, totalRequests = 0;
  const missingModels = new Set();
  for (const d of data) {
    totalRequests += d.request_count;
    const p = getPrice(d.model);
    const cached = d.tokens_cached || 0, writes = d.tokens_new_cache || 0;
    // tokens_in includes both cache reads AND new cache writes.
    const ordinary = Math.max(0, d.tokens_in - cached - writes);
    const buckets = [[ordinary, p?.input], [cached, p?.cached], [writes, p?.cacheCreation], [d.tokens_out || 0, p?.output]];
    if (!p || buckets.some(([tokens, price]) => tokens > 0 && price == null)) {
      missingModels.add(d.model);
      continue;
    }
    cost += buckets.reduce((sum, [tokens, price]) => sum + tokens / 1e6 * (price ?? 0), 0);
    pricedRequests += d.request_count;
  }
  return { cost, pricedRequests, totalRequests, missingModels: [...missingModels].sort() };
}

function fmtUSD(n) { if(n>=1) return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return '$'+n.toFixed(4); }

function fmtNum(n) { if(n>=1e9) return (n/1e9).toFixed(1)+'B'; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return n.toString(); }

function fmtLocalDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

async function fetchData() {
  const requestID = ++dataRequestID;
  let start, end;
  const now = new Date();
  const cr = String(currentRange);
  if (cr === 'month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = now;
  } else if (cr === 'quarter') {
    const q = Math.floor(now.getMonth() / 3);
    start = new Date(now.getFullYear(), q * 3, 1);
    end = now;
  } else if (cr.startsWith('pick:')) {
    const val = cr.slice(5);
    if (val.includes('Q')) {
      const [y, qStr] = val.split('-Q');
      const qi = parseInt(qStr) - 1;
      start = new Date(parseInt(y), qi * 3, 1);
      end = new Date(parseInt(y), qi * 3 + 3, 0);
    } else {
      const parts = val.split('-');
      const y = parseInt(parts[0]), m = parseInt(parts[1]);
      if (isNaN(y) || isNaN(m)) { console.error('Invalid pick value:', val); return; }
      start = new Date(y, m - 1, 1);
      end = new Date(y, m, 0);
    }
    if (end > now) end = now;
  } else {
    const days = parseInt(cr, 10);
    if (isNaN(days)) { console.error('Invalid range:', cr); return; }
    end = now; start = new Date(); start.setDate(start.getDate() - days);
  }
  if (isNaN(start.getTime()) || isNaN(end.getTime())) { console.error('Invalid date range:', start, end, 'range:', cr); return; }
  const token = document.getElementById('apiToken').value;
  const status = document.getElementById('tokenStatus');
  if (!token) { rawData = []; PRICING = Object.create(null); pricingLoaded = false; pricingError = true; render(); status.className = 'status err'; status.textContent = '⚠ Token required'; return; }
  localStorage.setItem('c2a_token', token);
  try {
    const params = new URLSearchParams({ start: fmtLocalDate(start), end: fmtLocalDate(end), timezone: clientTimeZone });
    const r = await fetch(new URL(`usage?${params.toString()}`, document.baseURI), { headers: { 'Authorization': 'Bearer ' + token } });
    if (requestID !== dataRequestID) return;
    if (r.status === 401 || r.status === 403) { status.className = 'status err'; status.textContent = '✗ Invalid token'; return; }
    const data = await r.json();
    if (requestID !== dataRequestID) return;
    if (data?.error) { status.className = 'status err'; status.textContent = data.error; return; }
    if (!r.ok || !Array.isArray(data)) throw new Error('Invalid usage response');
    status.className = 'status ok'; status.textContent = '✓';
    rawData = data;
    PRICING = Object.create(null);
    pricingLoaded = false;
    pricingError = false;
    populateFilters();
    render();
    try {
      const prices = await fetchPricing(data.map(d => d.model), token);
      if (requestID !== dataRequestID) return;
      PRICING = prices;
      pricingLoaded = true;
    } catch (e) {
      if (requestID !== dataRequestID) return;
      pricingError = true;
      console.warn('pricing fetch failed', e);
    }
    render();
  } catch(e) { if (requestID === dataRequestID) { status.className = 'status err'; status.textContent = e.message; } }
}

function populateFilters() {
  const clients = new Set(), models = new Set(), accounts = new Set(), reasoningEfforts = new Set();
  rawData.forEach(d => { clients.add(clientValue(d)); models.add(d.model); accounts.add(d.username || d.account_id); reasoningEfforts.add(reasoningEffortValue(d)); });
  const fC = document.getElementById('fClient'), fM = document.getElementById('fModel'), fA = document.getElementById('fAccount'), fR = document.getElementById('fReasoningEffort');
  const prevC = filterClient, prevM = filterModel, prevA = filterAccount, prevR = filterReasoningEffort;
  populateFilterOptions(fC, 'All Clients', clients);
  populateFilterOptions(fM, 'All Models', models);
  populateFilterOptions(fA, 'All Accounts', accounts);
  populateFilterOptions(fR, 'All Efforts', reasoningEfforts, reasoningEffortLabel);
  fC.value = prevC || filterClient; fM.value = prevM || filterModel; fA.value = prevA || filterAccount; fR.value = prevR || filterReasoningEffort;
}

function populateFilterOptions(select, allLabel, values, label = value => value) {
  select.replaceChildren(new Option(allLabel, ''));
  [...values].sort().forEach(value => select.add(new Option(label(value), value)));
}

function clientValue(d) { return d.client_id || 'default'; }
function reasoningEffortValue(d) { return d.reasoning_effort || 'unspecified'; }
function reasoningEffortLabel(effort) { return effort === 'unspecified' ? 'Unspecified' : effort; }

function filtered() {
  return rawData.filter(d => {
    if (filterClient && clientValue(d) !== filterClient) return false;
    if (filterModel && d.model !== filterModel) return false;
    if (filterAccount && (d.username || d.account_id) !== filterAccount) return false;
    if (filterReasoningEffort && reasoningEffortValue(d) !== filterReasoningEffort) return false;
    return true;
  });
}

function render() {
  const data = filtered();
  renderCards(data);
  renderChart(data);
}

function renderCards(data) {
  const totalReqs = data.reduce((a,d) => a + d.request_count, 0);
  const totalIn = data.reduce((a,d) => a + d.tokens_in, 0);
  const totalCached = data.reduce((a,d) => a + d.tokens_cached, 0);
  const totalNewCache = data.reduce((a,d) => a + (d.tokens_new_cache || 0), 0);
  const totalOut = data.reduce((a,d) => a + d.tokens_out, 0);
  const totalNoncached = totalIn - totalCached;
  const cacheRate = totalIn > 0 ? (totalCached / totalIn * 100).toFixed(1) : '0.0';
  const estimate = estimateCost(data);
  const incomplete = estimate.missingModels.length > 0;
  const costLabel = pricingLoaded && incomplete ? 'Est. Cost (partial)' : 'Est. Cost';
  const costValue = !pricingLoaded ? (pricingError ? 'Unavailable' : 'Loading…')
    : incomplete && estimate.pricedRequests === 0 ? 'Unavailable' : fmtUSD(estimate.cost);
  const pricingStatus = document.getElementById('pricingStatus');
  if (!pricingLoaded) {
    pricingStatus.textContent = pricingError ? 'Prices unavailable — cost not calculated. Refresh to retry.' : 'Loading prices for historical models…';
  } else {
    const coverage = `Priced ${estimate.pricedRequests.toLocaleString('en-US')} / ${estimate.totalRequests.toLocaleString('en-US')} requests.`;
    pricingStatus.textContent = coverage + (incomplete ? ` Missing required prices: ${estimate.missingModels.join(', ')}. Shown cost is a subtotal only.` : '')
      + ' Current base-rate estimate, not a bill; long-context tiers and cache TTL pricing are not modeled.';
  }
  document.getElementById('cards-subtitle').innerHTML = `Requests: <span style="font-weight:700;color:var(--text)">${fmtNum(totalReqs)}</span>`;
  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="label">Total Input</div><div class="value">${fmtNum(totalIn)}</div></div>
    <div class="card"><div class="label" title="Total input minus cache reads; includes cache writes shown separately">Input (non-cached)</div><div class="value">${fmtNum(totalNoncached)}</div></div>
    <div class="card"><div class="label">Cached Input</div><div class="value">${fmtNum(totalCached)}</div></div>
    <div class="card"><div class="label">Cache Write</div><div class="value">${fmtNum(totalNewCache)}</div></div>
    <div class="card"><div class="label">Output</div><div class="value">${fmtNum(totalOut)}</div></div>
    <div class="card"><div class="label">Cache Rate</div><div class="value">${cacheRate}%</div></div>
    <div class="card"><div class="label">${costLabel}</div><div class="value" style="color:#f59e0b">${costValue}</div></div>`;
}

function aggrKey(dateStr) {
  if (currentAggr === 'day') return dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  if (currentAggr === 'week') {
    const tmp = new Date(d); tmp.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return fmtLocalDate(tmp);
  }
  return dateStr.slice(0,7);
}

function renderChart(data) {
  const byBucket = {};
  const dims = new Set();
  data.forEach(d => {
    const bucket = aggrKey(d.date);
    let k;
    const parts = [];
    if (currentDims.client) parts.push(clientValue(d));
    if (currentDims.model) parts.push(d.model);
    if (currentDims.account) parts.push(d.username || d.account_id);
    if (currentDims.reasoningEffort) parts.push(reasoningEffortLabel(reasoningEffortValue(d)));
    k = parts.length ? parts.join(' / ') : 'total';
    dims.add(k);
    if (!byBucket[bucket]) byBucket[bucket] = {};
    if (!byBucket[bucket][k]) byBucket[bucket][k] = { cached: 0, noncached: 0, output: 0, cost: 0, incomplete: false };
    byBucket[bucket][k].cached += d.tokens_cached;
    byBucket[bucket][k].noncached += (d.tokens_in - d.tokens_cached);
    byBucket[bucket][k].output += d.tokens_out;
    const estimate = estimateCost([d]);
    byBucket[bucket][k].cost += estimate.cost;
    byBucket[bucket][k].incomplete ||= !pricingLoaded || estimate.missingModels.length > 0;
  });
  const buckets = Object.keys(byBucket).sort();
  const colors = ['#0ea5e9','#7c3aed','#f59e0b','#10b981','#ef4444','#ec4899','#6366f1','#14b8a6'];
  const datasets = [];
  let ci = 0;
  const tv = currentTokenView;
  [...dims].sort().forEach(dim => {
    const displayDim = dim.replace(/^claude-/, '').replace(/-internal$/, '');
    const color = colors[ci % colors.length];
    const stk = 'stk_' + ci;
    if (tv === 'input') {
      datasets.push({ label: displayDim + ' (cached)', data: buckets.map(b => (byBucket[b]?.[dim]?.cached || 0)), backgroundColor: color, stack: stk });
      datasets.push({ label: displayDim + ' (input)', data: buckets.map(b => (byBucket[b]?.[dim]?.noncached || 0)), backgroundColor: color + '55', stack: stk });
    } else if (tv === 'output') {
      datasets.push({ label: displayDim + ' (output)', data: buckets.map(b => (byBucket[b]?.[dim]?.output || 0)), backgroundColor: color, stack: stk });
    } else {
      datasets.push({ label: displayDim + ' (cached)', data: buckets.map(b => (byBucket[b]?.[dim]?.cached || 0)), backgroundColor: color, stack: stk });
      datasets.push({ label: displayDim + ' (non-cached)', data: buckets.map(b => ((byBucket[b]?.[dim]?.noncached || 0) + (byBucket[b]?.[dim]?.output || 0))), backgroundColor: color + '55', stack: stk });
    }
    ci++;
  });
  // build per-stack totals for top labels
  const stackIds = [...new Set(datasets.map(d => d.stack))];
  const stackTotals = {}; // {stack: {bucketIdx: {total, cached, noncached}}}
  stackIds.forEach(stk => {
    stackTotals[stk] = {};
    buckets.forEach((_, bi) => {
      let cached = 0, noncached = 0, cost = 0, incomplete = false;
      datasets.filter(ds => ds.stack === stk).forEach(ds => {
        if (ds.label.includes('cached') && !ds.label.includes('non-cached')) cached += (ds.data[bi] || 0);
        else noncached += (ds.data[bi] || 0);
      });
      // get cost from byBucket
      const dim = [...dims].sort()[stackIds.indexOf(stk)];
      if (dim && byBucket[buckets[bi]]?.[dim]) {
        cost = byBucket[buckets[bi]][dim].cost;
        incomplete = byBucket[buckets[bi]][dim].incomplete;
      }
      stackTotals[stk][bi] = { total: cached + noncached, cached, noncached, cost, incomplete };
    });
  });

  const topLabelPlugin = {
    id: 'topLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.textAlign = 'center';
      // Collect all label positions per bucket to avoid overlap
      const labelsByBucket = {}; // {bi: [{x, y, lines}]}
      stackIds.forEach(stk => {
        const stkDatasets = chart.data.datasets.map((ds, i) => ({ ds, i })).filter(x => x.ds.stack === stk);
        if (!stkDatasets.length) return;
        const topDsIdx = stkDatasets[stkDatasets.length - 1].i;
        const meta = chart.getDatasetMeta(topDsIdx);
        if (meta.hidden) return;
        meta.data.forEach((bar, bi) => {
          const info = stackTotals[stk]?.[bi];
          if (!info || info.total === 0) return;
          if (!labelsByBucket[bi]) labelsByBucket[bi] = [];
          let line1 = fmtNum(info.total);
          if (info.cost > 0) line1 += ', ' + fmtUSD(info.cost) + (info.incomplete ? ' (partial)' : '');
          else if (info.incomplete) line1 += ', cost N/A';
          let line2 = null;
          if (info.cached > 0) {
            const pct = (info.cached / info.total * 100).toFixed(0);
            line2 = `C:${fmtNum(info.cached)}(${pct}%)`;
          }
          labelsByBucket[bi].push({ x: bar.x, baseY: bar.y - 4, line1, line2 });
        });
      });
      // Draw labels directly on top of bars (allow overlap)
      for (const bi in labelsByBucket) {
        const labels = labelsByBucket[bi];
        for (let i = 0; i < labels.length; i++) {
          const lbl = labels[i];
          let drawY = lbl.baseY;
          if (lbl.line2) {
            ctx.font = '10px -apple-system, sans-serif';
            ctx.fillStyle = '#e0e0e0';
            ctx.fillText(lbl.line2, lbl.x, drawY);
            drawY -= 13;
          }
          ctx.font = 'bold 10px -apple-system, sans-serif';
          ctx.fillStyle = '#e0e0e0';
          ctx.fillText(lbl.line1, lbl.x, drawY);
          // label drawn
        }
      }
      // bottom labels: dimension name at 45° with enough room
      stackIds.forEach(stk => {
        const stkDatasets = chart.data.datasets.map((ds, i) => ({ ds, i })).filter(x => x.ds.stack === stk);
        if (!stkDatasets.length) return;
        const bottomDsIdx = stkDatasets[0].i;
        const meta = chart.getDatasetMeta(bottomDsIdx);
        if (meta.hidden) return;
        const dimName = stkDatasets[0].ds.label.replace(/\s*\(.*\)$/, '');
        if (dimName === 'total') return;
        const short = dimName.replace(/^claude-/, '').replace(/-internal$/, '');
        meta.data.forEach((bar, bi) => {
          const info = stackTotals[stk]?.[bi];
          if (!info || info.total === 0) return;
          const yAxis = chart.scales.y;
          const bottomY = yAxis.getPixelForValue(0);
          ctx.save();
          ctx.translate(bar.x, bottomY + 6);
          ctx.rotate(Math.PI / 3);
          ctx.textAlign = 'left';
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = '#aaa';
          ctx.fillText(short, 0, 0);
          ctx.restore();
        });
      });
      ctx.restore();
    }
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: { labels: buckets, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      animation: false,
      layout: { padding: { top: 40, bottom: 60 } },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmtNum(ctx.raw)}` } }
      },
      scales: {
        x: { stacked: true, ticks: { color: '#888' } },
        y: { stacked: true, ticks: { color: '#888', callback: v => fmtNum(v) } }
      }
    },
    plugins: [topLabelPlugin]
  });
}

showDashboard();
</script>
</body>
</html>
